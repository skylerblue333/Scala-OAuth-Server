name: scala-oauth-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Scala
        run: mvn -B -ntp clean verify
      - name: Dependency audit
        run: mvn -B -ntp org.owasp:dependency-check-maven:12.1.3:check -DfailBuildOnCVSS=7
      - name: Build image
        run: docker build -t sky-scala-oauth:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-scala-oauth:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke startup
        run: docker run --rm sky-scala-oauth:ci | grep '"status":"ready"'
